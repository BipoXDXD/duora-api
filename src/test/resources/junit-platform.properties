# As classes de teste rodam uma de cada vez, de propósito. Alguns testes fazem DDL numa tabela que todos os outros
# usam (RateLimitTestSupport.whileTheLimitCannotBeCounted renomeia rate_limit_bucket, UnexpectedErrorIT renomeia
# waitlist_entry) e o limite por conta divide uma tabela só. Em paralelo, um teste veria a tabela do outro sumir.
junit.jupiter.execution.parallel.enabled=false

# jqwik (property-based testing, ADR 0003). Cada propriedade sorteia uma semente nova a cada execução e, se falhar,
# o relatório mostra o "seed" e o "sample" mínimo. Reproduzir: @Property(seed = "<seed>") na propriedade.
# 200 tentativas por propriedade mantêm o ./mvnw test rápido; propriedade que precisa de mais declara tries.
jqwik.tries.default=200
# Depois de uma falha, a próxima execução local repete primeiro o sample mínimo que falhou e depois a mesma semente.
jqwik.failures.after.default=SAMPLE_FIRST
# A base de falhas fica em target/: some com o clean e nunca suja o repositório.
jqwik.database=target/jqwik-database
# Semente fixa no código só para reproduzir uma falha; esquecida lá, ela vira aviso no relatório.
jqwik.seeds.whenfixed=WARN
# O relatório (seed, sample, tentativas) só aparece quando a propriedade falha.
jqwik.reporting.onlyfailures=true
