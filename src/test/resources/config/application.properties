# Só no classpath de teste (inclui spring-boot:test-run). O Boot lê config/application.properties
# por cima do application.properties principal, então isto completa as variáveis obrigatórias.
# Nenhum token real valida contra estes valores; BearerTokenValidationTest sobe o próprio JWKS.
DUORA_AUTH_ISSUER_URI=https://login.duora.test/tenant/v2.0
DUORA_AUTH_JWK_SET_URI=https://login.duora.test/tenant/discovery/v2.0/keys
DUORA_AUTH_AUDIENCE=duora-api-test
