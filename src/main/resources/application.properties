spring.application.name=duora-api

# O schema pertence ao Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true

# Autenticação: JWT emitido pelo Microsoft Entra External ID (docs/adr/0001). Sem as variáveis, a
# aplicação não sobe. Issuer e JWKS ficam explícitos porque o issuer dos tokens
# ({tenant-id}.ciamlogin.com) difere do host do documento de descoberta, o que a descoberta recusaria.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${DUORA_AUTH_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${DUORA_AUTH_JWK_SET_URI}
# Audience fora de spring.security...audiences: o binder do Boot aceitaria o placeholder sem valor
# como texto literal; SecurityConfiguration resolve esta via @Value, que falha na subida.
duora.auth.audience=${DUORA_AUTH_AUDIENCE}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256
# App roles do Entra chegam na claim "roles"; o valor ADMIN vira ROLE_ADMIN.
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

# Por IP: 10 inscrições por hora, repostas gradualmente.
duora.waitlist.join-rate-limit.capacity=10
duora.waitlist.join-rate-limit.period=PT1H
