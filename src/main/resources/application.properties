spring.application.name=duora-api

# O schema pertence ao Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true

# Ainda não há mecanismo de login: sem isso o Boot cria um usuário com senha gerada e a imprime no log.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Por IP: 10 inscrições por hora, repostas gradualmente.
duora.waitlist.join-rate-limit.capacity=10
duora.waitlist.join-rate-limit.period=PT1H
