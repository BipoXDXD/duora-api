spring.application.name=duora-api

# Logs em JSON (Elastic Common Schema) no stdout, uma linha por evento (docs/adr/0013). Para ler no
# terminal, o perfil plain-logs volta ao texto.
logging.structured.format.console=ecs

# O schema pertence ao Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-unknown-properties=true
# 10.5 num campo inteiro é erro do cliente, e não 10 (docs/adr/0016).
spring.jackson.deserialization.accept-float-as-int=false
# A API não recebe upload. Ligado, o Spring tenta ler as partes de todo multipart/* antes do handler,
# e um Content-Type sem boundary virava 500 (MultipartContentTypeIT). Volta com a primeira rota de
# upload, junto com limites de tamanho.
spring.servlet.multipart.enabled=false
spring.mvc.problemdetails.enabled=true

# Autenticação: JWT emitido pelo Microsoft Entra External ID (docs/adr/0001). Sem as variáveis, a
# aplicação não sobe. Issuer e JWKS ficam explícitos porque o issuer dos tokens
# ({tenant-id}.ciamlogin.com) difere do host do documento de descoberta, o que a descoberta recusaria.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${DUORA_AUTH_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${DUORA_AUTH_JWK_SET_URI}
# Audience fora de spring.security...audiences: o binder do Boot aceitaria o placeholder sem valor
# como texto literal; SecurityConfiguration resolve esta via @Value, que falha na subida.
duora.auth.audience=${DUORA_AUTH_AUDIENCE}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256
# App roles do Entra chegam na claim "roles"; o valor ADMIN vira ROLE_ADMIN.
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
# O "sub" do Entra muda conforme o app que recebe o token; o "oid" é o mesmo usuário em todo o tenant.
spring.security.oauth2.resourceserver.jwt.principal-claim-name=oid

# Login do front web pelo próprio Spring (BFF, docs/adr/0002). Sem as variáveis, a aplicação não sobe.
duora.auth.authority=${DUORA_AUTH_AUTHORITY}
duora.auth.web.client-id=${DUORA_AUTH_WEB_CLIENT_ID}
duora.auth.web.client-secret=${DUORA_AUTH_WEB_CLIENT_SECRET}

# Sessão do front web no PostgreSQL; o schema vem da migration V2 e o cookie de WebSessionConfiguration.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# Rate limit no PostgreSQL (docs/adr/0006): de quanto em quanto tempo apagar os buckets já repostos.
duora.rate-limit.cleanup-interval=PT10M

# Documentação da API (docs/adr/0012): desligada, como em produção. O perfil api-docs a liga, e mesmo
# assim só ADMIN a lê, porque fica sob /api/admin. A spec versionada é docs/openapi.json.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/api/admin/openapi
springdoc.swagger-ui.path=/api/admin/swagger-ui.html
springdoc.api-docs.version=openapi_3_1
springdoc.default-produces-media-type=application/json
# /error é o encaminhamento interno do Tomcat (ProblemDetailErrorController), não uma operação da API.
springdoc.paths-to-exclude=${server.error.path:/error}
# Saída estável, para o diff de docs/openapi.json mostrar só mudança de contrato.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Por IP: 10 inscrições por hora, repostas gradualmente.
duora.waitlist.join-rate-limit.capacity=10
duora.waitlist.join-rate-limit.period=PT1H

# Correlation ID = trace id W3C (docs/adr/0013). Só o traceparent W3C entra; B3 e baggage do cliente
# ficam de fora, porque nada aqui os usa. O sampler ignora a decisão de amostragem do cliente: com o
# padrão (parent-based), um traceparent com a flag "sampled" forçaria a exportação de todo trace.
management.tracing.propagation.consume=w3c
management.tracing.propagation.produce=w3c
management.tracing.baggage.enabled=false
management.opentelemetry.tracing.sampler=trace-id-ratio
# Sem coletor configurado, o registry OTLP tentaria enviar métricas para localhost:4318 a cada minuto.
# O envio de spans e métricas ao Azure Monitor liga no deploy, por variável de ambiente.
management.otlp.metrics.export.enabled=false

# Probes do Azure Container Apps (docs/adr/0014). Ligadas explicitamente, sem depender de detectar
# Kubernetes. A liveness não olha dependências: reiniciar não conserta o banco. A readiness inclui o
# banco, porque sem ele a API não atende nada; a réplica sai do tráfego sem reiniciar.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Graceful shutdown abaixo dos 30 s do Container Apps (terminationGracePeriodSeconds em
# infra/azure): a aplicação termina o que está em voo antes de a plataforma mandar o SIGKILL.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Denúncias por conta (docs/adr/0015): 10 por dia, repostas gradualmente.
duora.trustsafety.report-rate-limit.capacity=10
duora.trustsafety.report-rate-limit.period=P1D

# Inscrições e cancelamentos por conta (docs/adr/0016): 60 por hora, somados, uma ficha de volta por minuto.
duora.events.registration-rate-limit.capacity=60
duora.events.registration-rate-limit.period=PT1H

# Sorteios de rodada por conta ADMIN (docs/adr/0017): 30 por hora, uma ficha de volta a cada 2 minutos.
duora.matching.round-rate-limit.capacity=30
duora.matching.round-rate-limit.period=PT1H

# Decisões por conta (docs/adr/0019): 120 por hora, uma ficha de volta a cada 30 segundos.
duora.connections.decision-rate-limit.capacity=120
duora.connections.decision-rate-limit.period=PT1H

# Mensagens do chat por conta (docs/adr/0021): 20 por minuto, uma ficha de volta a cada 3 segundos.
duora.chat.message-rate-limit.capacity=20
duora.chat.message-rate-limit.period=PT1M
