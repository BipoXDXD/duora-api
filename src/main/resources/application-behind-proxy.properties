# Perfil behind-proxy (docs/adr/0006): a aplicação roda atrás do ingress do Azure Container Apps.
# O Tomcat troca o IP da conexão pelo do X-Forwarded-For (e o esquema pelo X-Forwarded-Proto) só
# quando quem conecta está na faixa de proxies confiáveis, em CIDR separados por vírgula. Sem a
# variável, ou com ela em branco, a aplicação não sobe (TrustedProxyProperties): vazia, a faixa
# confiaria em qualquer um.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${DUORA_TRUSTED_PROXIES}
