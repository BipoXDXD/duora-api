# Perfil api-docs (docs/adr/0011): publica a spec OpenAPI e o Swagger UI em /api/admin, só para ADMIN.
# Para desenvolvimento e para gerar docs/openapi.json nos testes; em produção fica desligado.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# O "Try it out" com a sessão web manda o token CSRF como o front (csrf.spa(), docs/adr/0002).
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
