# Lint da spec (docs/openapi.json) no CI: regras gerais do OpenAPI e o ruleset OWASP API Security
# (docs/adr/0012). Erro quebra o build; aviso aparece no log para revisão. Cada regra desligada
# abaixo diz por quê: o ruleset é linha de base, não meta de zero.
extends:
  - spectral:oas
  - "@stoplight/spectral-owasp-ruleset"

rules:
  # A API não manda headers RateLimit-*: o limite existe só onde há abuso a conter (o POST público
  # da waitlist, docs/adr/0006), que documenta o 429 com Retry-After. Rotas autenticadas ganham
  # limite quando tiverem custo que o justifique, e aí documentam o 429.
  owasp:api4:2023-rate-limit: off
  # Sem CORS: front e API ficam no mesmo site (docs/adr/0002), e o navegador não precisa do header.
  owasp:api8:2023-define-cors-origin: off

overrides:
  # Inscrição na waitlist é anônima de propósito (docs/adr/0002): sem sessão de vítima e chamada
  # também pelo app sem token. Limite por IP e resposta igual para e-mail novo ou repetido.
  - files:
      - "../../docs/openapi.json#/paths/~1api~1waitlist/post"
    rules:
      owasp:api2:2023-write-restricted: off
  # O logout não pede credencial de propósito (docs/adr/0002): quem chama sem sessão recebe o mesmo
  # 200, porque encerrar uma sessão que não existe é inofensivo. O que o protege é o token CSRF
  # (403 sem ele), que a spec não modela como esquema de segurança.
  - files:
      - "../../docs/openapi.json#/paths/~1logout/post"
    rules:
      owasp:api2:2023-write-restricted: off
  # pageToken é o cursor opaco da paginação (docs/adr/0005), não uma credencial: só marca a posição
  # na lista de quem chama, que a consulta filtra de qualquer jeito (docs/adr/0015, 0016, 0019). O nome segue o
  # padrão de paginação do contrato; a regra só olha o nome do parâmetro.
  - files:
      - "../../docs/openapi.json#/paths/~1api~1me~1blocked-accounts/get"
      - "../../docs/openapi.json#/paths/~1api~1events/get"
      - "../../docs/openapi.json#/paths/~1api~1me~1registrations/get"
      - "../../docs/openapi.json#/paths/~1api~1me~1connections/get"
    rules:
      owasp:api2:2023-no-credentials-in-url: off
