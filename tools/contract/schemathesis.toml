# Configuração do Schemathesis em infra/docker/contract-test.sh (docs/adr/0012).

[phases.coverage]
# Métodos fora da spec devem dar 405. QUERY e TRACE ficam de fora: o StrictHttpFirewall do Spring
# Security os recusa com 400 antes do roteamento, porque não estão na allowlist de métodos dele.
# A recusa é deliberada e não chega a nenhum handler.
unexpected-methods = ["get", "put", "post", "delete", "options", "patch"]

[checks]
# Além dos padrões do Schemathesis: 412 e 428 são as recusas do If-Match (docs/adr/0005). Um ETag
# gerado ao acaso quase nunca é a versão atual do perfil, então mesmo um corpo válido recebe 412.
positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 412, 428, 429, "5xx"]
negative_data_rejection.expected-statuses = [400, 401, 403, 404, 405, 406, 409, 412, 415, 422, 428, 429, "5xx"]
# Sem o If-Match obrigatório, a API responde 428 (Precondition Required), como manda a RFC 6585.
missing_required_header.expected-statuses = [400, 401, 403, 406, 415, 422, 428]

# A edição do perfil tem regras que o schema não expressa: maior de idade, data de nascimento que não
# muda, nome e região que não podem ser apagados, texto sem caracteres invisíveis. Um corpo válido
# pelo schema pode, então, receber 400 de propósito, e essas regras têm testes próprios (ProfileIT).
# Os outros checks, inclusive o de dado inválido recusado, continuam valendo nesta operação.
[[operations]]
include-name = "PATCH /api/me/profile"
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 409, 412, 428, 429, "5xx"]

# Denúncia (docs/adr/0015): o motivo OTHER exige descrição, e a descrição recusa caracteres invisíveis,
# regras que o schema não expressa; um corpo válido pelo schema pode receber 400 de propósito (ReportIT).
[[operations]]
include-name = "POST /api/reports"
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 429, "5xx"]

# O pageToken só vale se a própria API o gerou: um texto qualquer no formato do schema recebe 400 de
# propósito (BlockIT.malformedPageTokenIsRejected).
[[operations]]
include-name = "GET /api/me/blocked-accounts"
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 429, "5xx"]

# Criação de evento (docs/adr/0016): início no futuro e até 365 dias à frente, fim depois do início e no
# máximo 12 horas após ele, texto sem caracteres invisíveis nem só com espaços. O schema não expressa
# essas regras, então um corpo válido por ele pode receber 400 de propósito (AdminEventIT).
[[operations]]
include-name = "POST /api/admin/events"
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 429, "5xx"]

# Como em /api/me/blocked-accounts, o pageToken só vale se a própria API o gerou: um texto qualquer no
# formato do schema recebe 400 de propósito (EventCatalogIT.invalidPageTokenIsABadRequest,
# RegistrationIT.invalidPageOfOwnRegistrationsIsABadRequest).
[[operations]]
include-name = "GET /api/events"
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 429, "5xx"]

# Lista do ADMIN (docs/adr/0016): o mesmo pageToken, que só vale se a própria API o gerou
# (AdminEventListIT.invalidPageTokenIsABadRequest).
[[operations]]
include-name = "GET /api/admin/events"
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 429, "5xx"]

[[operations]]
include-name = "GET /api/me/registrations"
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 429, "5xx"]

# Conexões (docs/adr/0019): o mesmo pageToken opaco que só vale se a própria API o gerou
# (ConnectionIT.aPageTokenTheApiDidNotIssueIsABadRequest).
[[operations]]
include-name = "GET /api/me/connections"
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 429, "5xx"]

# Chat (docs/adr/0021): o texto recusa caracteres invisíveis e só espaços, e é contado depois de normalizado
# em NFC, regras que o schema não expressa; um corpo válido pelo schema pode receber 400 de propósito
# (ChatIT.invalidTextIsRejectedWithoutWriting, ChatFieldErrorsIT). A conta do token de teste nunca forma par,
# então o resto das chamadas termina em 404.
[[operations]]
include-name = "POST /api/events/{eventId}/rounds/{number}/chat/messages"
checks.positive_data_acceptance.expected-statuses = ["2xx", 400, 401, 403, 404, 409, 429, "5xx"]

# O logout é rota da cadeia de sessão do Spring Security (docs/adr/0002, 0012). O fuzzing manda sempre
# Authorization: Bearer, o que leva a requisição à cadeia bearer, que não participa do logout
# (docs/adr/0001): 404 em qualquer método com token válido e 401 com token inválido, como numa rota
# qualquer que não existe (BearerTokenValidationIT.validTokenOnUnknownRouteIsANotFoundWithoutRedirect).
# Isso não é o contrato do logout (a spec descreve a sessão web), e a porta de sessão fica fora do
# Schemathesis porque exige o login interativo no Entra. O contrato do logout é coberto por
# OpenApiContractIT.logoutDocumentsWhatSpringSecurityDoes e WebLoginIT.
[[operations]]
include-path = "/logout"
enabled = false
