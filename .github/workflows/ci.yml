name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testes rápidos (Surefire) + integração com PostgreSQL via Testcontainers (Failsafe).
      # O Docker já vem instalado no runner ubuntu-latest.
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco-all/
          if-no-files-found: ignore

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  image:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Os testes ficam no job de build; aqui só se confere que a imagem sobe e se comporta.
      - name: Build
        run: docker build --tag duora-api:${{ github.sha }} .

      - name: Smoke test
        run: infra/docker/smoke-test.sh duora-api:${{ github.sha }}

      # Schemathesis contra a imagem subida, a partir de docs/openapi.json (docs/adr/0011).
      - name: Teste de contrato
        run: infra/docker/contract-test.sh duora-api:${{ github.sha }}

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O Azure CLI já vem no runner; só falta o Bicep. Nada aqui faz login nem chama a Azure.
      - name: Instalar o Bicep
        run: az bicep install

      - name: Build, lint e formatação
        run: infra/azure/validate.sh

  contract:
    name: Contrato da API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o diff de breaking change lê a spec da main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/contract/package-lock.json

      # Versões do package-lock.json; sem scripts de instalação de dependências.
      - name: Instalar Spectral
        run: npm ci --ignore-scripts --prefix tools/contract

      - name: Lint da spec (Spectral + OWASP)
        run: npm run --prefix tools/contract lint

      # Breaking change só entra registrada em docs/api-changelog.md no mesmo PR.
      - name: Breaking changes (oasdiff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: tools/contract/check-breaking.sh "origin/$BASE_REF"

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # o gitleaks lista os commits do PR pela API
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o gitleaks varre o histórico inteiro, não só o último commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
